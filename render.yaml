services:
  - type: web
    name: bg-remover-bot
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false 
      
      - key: PYTHON_VERSION
        value: 3.11.0
    
    healthCheckPath: /
    
    autoDeploy: true
